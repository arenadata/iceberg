volumes:
  data: {}

services:

  download-jars:
    image: curlimages/curl
    user: root
    command: sh -c "/hive-jars/setup-env.sh"
    volumes:
      - ./hive-libs:/hive-jars

  minio:
    image: minio/minio
    hostname: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=warehouse
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  create-bucket:
    image: minio/mc
    depends_on:
      - minio
    volumes:
      - data:/data
    entrypoint: mc mb /data/bucket /data/warehouse

  iceberg:
    image: apache/iceberg-rest-fixture
    depends_on:
      - create-bucket
    hostname: iceberg
    ports:
      - 8181:8181
    environment:
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_URI=jdbc:sqlite:file:/tmp/iceberg_rest_mode=memory
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_S3_ACCESS__KEY__ID=minioadmin
      - CATALOG_S3_SECRET__ACCESS__KEY=minioadmin

  hive-metastore:
    image: apache/hive:4.0.0
    ports:
      - 9083:9083
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_AUX_JARS_PATH: /opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/bundle-2.23.19.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar
      HADOOP_CLASSPATH: /opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/bundle-2.23.19.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE_ACCESS: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=s3a://warehouse/
        -Dmetastore.warehouse.dir=s3a://warehouse/
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.access.key=minioadmin
        -Dfs.s3a.secret.key=minioadmin
        -Dfs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        -Dfs.s3a.connection.ssl.enabled=false
    command: >
      /opt/hive/bin/hive --service metastore -p 9083
    healthcheck:
      test: [ "CMD-SHELL", "HADOOP_OPTS=\"$$SERVICE_OPTS\" /opt/hive/bin/schematool -dbType postgres -info" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      metastore-db:
        condition: service_healthy
      download-jars:
        condition: service_completed_successfully
    volumes:
      - ./hive-libs/postgresql-42.7.7.jar:/opt/hive/lib/postgresql-42.7.7.jar:ro
      - ./hive-libs/hadoop-aws-3.3.6.jar:/opt/hive/lib/hadoop-aws-3.3.6.jar:ro
      - ./hive-libs/bundle-2.23.19.jar:/opt/hive/lib/bundle-2.23.19.jar:ro
      - ./hive-libs/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar:ro
      - ./hive-libs/core-site.xml:/opt/hive/conf/core-site.xml:ro

  metastore-db:
    image: postgres:15
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hive -d metastore" ]
      interval: 5s
      timeout: 5s
      retries: 20
