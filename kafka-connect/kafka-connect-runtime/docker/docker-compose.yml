volumes:
  data: {}

services:
  download-jars:
    image: curlimages/curl
    user: root
    command: sh -c "/hive-jars/setup-env.sh"
    volumes:
      - ./hive-libs:/hive-jars
      - ./connect-libs:/connect-jars

  object-store:
    image: rustfs/rustfs:1.0.0
    hostname: object-store
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
      - RUSTFS_OBS_LOG_STDOUT_ENABLED=true
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-bucket:
    image: rustfs/rustfs:1.0.0
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        curl -sf -o /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user admin:password
        --head http://object-store:9000/bucket ||
        curl -sSf --aws-sigv4 aws:amz:us-east-1:s3 --user admin:password
        -X PUT http://object-store:9000/bucket

  iceberg:
    image: apache/iceberg-rest-fixture
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    hostname: iceberg
    ports:
      - 8181:8181
    environment:
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://bucket/warehouse/
      - CATALOG_URI=jdbc:sqlite:file:/tmp/iceberg_rest_mode=memory
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://object-store:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_S3_ACCESS__KEY__ID=admin
      - CATALOG_S3_SECRET__ACCESS__KEY=password

  kafka:
    image: confluentinc/cp-kafka:8.1.2
    hostname: kafka
    ports:
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: E-JXLvCaTiaUYDb1LwZ1JQ

  connect:
    image: ghcr.io/arenadata/kafka-connect:4.3.1.1-4.1.0-1
    depends_on:
      kafka:
        condition: service_started
      download-jars:
        condition: service_completed_successfully
    hostname: connect
    ports:
      - 8083:8083
    volumes:
      - ../build/install:/test/kafka-connect
      - ./kms/iceberg-test-kms-1.0.0.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/iceberg-test-kms-1.0.0.jar:ro
      - ./connect-libs/commons-collections-3.2.2.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/commons-collections-3.2.2.jar:ro
      - ./connect-libs/s3-transfer-manager-2.42.39.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/s3-transfer-manager-2.42.39.jar:ro
      - ./connect-libs/hadoop-aws-3.4.1.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hadoop-aws-3.4.1.jar:ro
      - ./connect-libs/hadoop-auth-3.4.1.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hadoop-auth-3.4.1.jar:ro
      - ./connect-libs/hadoop-common-3.4.1.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hadoop-common-3.4.1.jar:ro
      - ./connect-libs/hive-storage-api-2.7.2.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hive-storage-api-2.7.2.jar:ro

    environment:
      CONNECT_REST_ADVERTISED_HOST_NAME: localhost
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kc
      CONNECT_CONFIG_STORAGE_TOPIC: kc-config
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: kc-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: kc-storage
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_PLUGIN_PATH: /test/kafka-connect
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 500

  hive-metastore:
    image: apache/hive:4.0.0
    ports:
      - 9083:9083
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_AUX_JARS_PATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://object-store:9000
      S3_PATH_STYLE_ACCESS: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=s3a://warehouse/
        -Dmetastore.warehouse.dir=s3a://warehouse/
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.endpoint=http://object-store:9000
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.access.key=admin
        -Dfs.s3a.secret.key=password
        -Dfs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        -Dfs.s3a.connection.ssl.enabled=false
    command: >
      /opt/hive/bin/hive --service metastore -p 9083
    depends_on:
      metastore-db:
        condition: service_healthy
      download-jars:
        condition: service_completed_successfully
    volumes:
      - ./hive-libs/postgresql-42.7.7.jar:/opt/hive/lib/postgresql-42.7.7.jar:ro
      - ./hive-libs/hadoop-aws-3.3.6.jar:/opt/hive/lib/hadoop-aws-3.3.6.jar:ro
      - ./hive-libs/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar:ro
      - ./hive-libs/core-site.xml:/opt/hive/conf/core-site.xml:ro

  metastore-db:
    image: postgres:15
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hive -d metastore" ]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-iceberg:
    image: apache/spark:4.0.4
    user: root
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    command: tail -f /dev/null
    depends_on:
      download-jars:
        condition: service_completed_successfully
    volumes:
      - ./connect-libs/iceberg-aws-bundle.jar:/opt/spark/jars/iceberg-aws-bundle.jar
      - ./connect-libs/iceberg-spark-runtime.jar:/opt/spark/jars/iceberg-spark-runtime.jar:ro
      - ./connect-libs/hadoop-aws-3.4.1.jar:/opt/spark/jars/hadoop-aws-3.4.1.jar
      - ./connect-libs/s3-transfer-manager-2.42.39.jar:/opt/spark/jars/s3-transfer-manager-2.42.39.jar

  openmetadata-db:
    image: openmetadata/postgresql:1.13.0
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: psql -d openmetadata_db -U test -Atc 'SELECT 1;'
      interval: 30s
      timeout: 15s
      retries: 3
    ports:
      - "5432:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
    ports:
      - "9200:9200"

  openmetadata:
    image: openmetadata/server:1.12.12
    restart: always
    ports:
      - "8585:8585"
    command:
      - "-c"
      - "./bootstrap/openmetadata-ops.sh migrate && ./bin/openmetadata-server-start.sh conf/openmetadata.yaml"
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_HOST: openmetadata-db
      DB_PORT: 5432
      DB_USER: test
      DB_USER_PASSWORD: test
      DB_DATABASE: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SEMANTIC_SEARCH_ENABLED: "false"
      FORCE_REINDEX: "false"
      OPENMETADATA_OPERATIONS_OPTS: "-Dopenmetadata.search.semantic.enabled=false"
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://ingestion:8080
      SERVER_HOST_API_URL: http://openmetadata:8585/api
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck" ]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      openmetadata-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  ingestion:
    image: openmetadata/ingestion:1.12.12
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: "/opt/airflow/dag_generated_configs"
      OPENMETADATA_SERVER_URL: http://openmetadata:8585
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__OPENMETADATA_API_ENDPOINT: http://openmetadata:8585/api
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__AUTH_PROVIDER: no-auth
      AIRFLOW__LINEAGE__OPENMETADATA_API_ENDPOINT: http://openmetadata:8585/api
      AIRFLOW__LINEAGE__AUTH_PROVIDER_TYPE: no-auth

      DB_HOST: openmetadata-db
      DB_PORT: 5432
      AIRFLOW_DB: airflow_db
      DB_USER: test
      DB_PASSWORD: test
      DB_SCHEME: postgresql+psycopg2
      DB_PROPERTIES: ""

    entrypoint: /bin/bash
    command:
      - "/opt/airflow/ingestion_dependency.sh"

    ports:
      - "8080:8080"

    depends_on:
      openmetadata-db:
        condition: service_healthy
      openmetadata:
        condition: service_healthy
