volumes:
  data: {}

services:
  download-jars:
    image: curlimages/curl
    user: root
    command: >
      sh -c "
      mkdir -p /jars &&
      curl -L -o /jars/aws-java-sdk-bundle-1.12.367.jar
      https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.367/aws-java-sdk-bundle-1.12.367.jar
      "
    volumes:
      - ./hive-libs:/jars
  minio:
    image: minio/minio
    hostname: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - data:/data
    command: server /data --console-address ":9001"

  create-bucket:
    image: minio/mc
    depends_on:
      - minio
    volumes:
      - data:/data
    entrypoint: mc mb /data/bucket

  iceberg:
    image: apache/iceberg-rest-fixture
    depends_on:
      - create-bucket
    hostname: iceberg
    ports:
      - 8181:8181
    environment:
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://bucket/warehouse/
      - CATALOG_URI=jdbc:sqlite:file:/tmp/iceberg_rest_mode=memory
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_S3_ACCESS__KEY__ID=minioadmin
      - CATALOG_S3_SECRET__ACCESS__KEY=minioadmin

  kafka:
    image: confluentinc/cp-kafka:8.1.2
    hostname: kafka
    ports:
      - 29092:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: E-JXLvCaTiaUYDb1LwZ1JQ

  connect:
    image: confluentinc/cp-kafka-connect:8.1.2
    depends_on:
      - kafka
    hostname: connect
    ports:
      - 8083:8083
    volumes:
      - ../build/install:/test/kafka-connect
      - ./kms/iceberg-test-kms-1.0.0.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/iceberg-test-kms-1.0.0.jar:ro
      - ./connect-libs/s3-transfer-manager-2.42.39.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/s3-transfer-manager-2.42.39.jar:ro
      - ./connect-libs/hadoop-aws-3.4.1.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hadoop-aws-3.4.1.jar:ro
      - ./connect-libs/hadoop-auth-3.4.1.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hadoop-auth-3.4.1.jar:ro
      - ./connect-libs/hadoop-common-3.4.1.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hadoop-common-3.4.1.jar:ro
      - ./connect-libs/hive-storage-api-2.7.2.jar:/test/kafka-connect/iceberg-kafka-connect-runtime/lib/hive-storage-api-2.7.2.jar:ro

    environment:
      CONNECT_REST_ADVERTISED_HOST_NAME: localhost
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kc
      CONNECT_CONFIG_STORAGE_TOPIC: kc-config
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: kc-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: kc-storage
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: false
      CONNECT_PLUGIN_PATH: /test/kafka-connect
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 500

  hive-metastore:
    image: apache/hive:4.0.0
    ports:
      - 9083:9083
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_AUX_JARS_PATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE_ACCESS: "true"
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.warehouse.dir=s3a://warehouse/
        -Dmetastore.warehouse.dir=s3a://warehouse/
        -Dfs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        -Dfs.s3a.endpoint=http://minio:9000
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.access.key=minioadmin
        -Dfs.s3a.secret.key=minioadmin
        -Dfs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
        -Dfs.s3a.connection.ssl.enabled=false
    command: >
      /opt/hive/bin/hive --service metastore -p 9083
    depends_on:
      metastore-db:
        condition: service_healthy
      download-jars:
        condition: service_completed_successfully
    volumes:
      - ./hive-libs/postgresql-42.7.7.jar:/opt/hive/lib/postgresql-42.7.7.jar:ro
      - ./hive-libs/hadoop-aws-3.3.6.jar:/opt/hive/lib/hadoop-aws-3.3.6.jar:ro
      - ./hive-libs/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar:ro
      - ./hive-libs/core-site.xml:/opt/hive/conf/core-site.xml:ro

  metastore-db:
    image: postgres:15
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hive -d metastore" ]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-iceberg:
    image: apache/spark:latest
    user: root
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
    command: tail -f /dev/null
    volumes:
      - ../../../aws-bundle/build/libs/iceberg-aws-bundle-1.10.1_arenadata1.jar:/opt/spark/jars/iceberg-aws-bundle-1.10.1_arenadata1.jar
      - ../../../spark/v4.0/spark-runtime/build/libs/iceberg-spark-runtime-4.0_2.13-1.10.1_arenadata1.jar:/opt/spark/jars/iceberg-spark-runtime-4.0_2.13-1.10.1_arenadata1.jar
      - ./connect-libs/hadoop-aws-3.4.1.jar:/opt/spark/jars/hadoop-aws-3.4.1.jar
      - ./connect-libs/s3-transfer-manager-2.42.39.jar:/opt/spark/jars/s3-transfer-manager-2.42.39.jar
