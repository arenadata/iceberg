# Regenerates .readiness/publication.yaml for ADRM by running the publisher exactly as publish.yml does
# (four Gradle publish invocations, the last one on JDK 21 for Flink 2.2), with every publish task
# redirected into a sandbox directory by arenadata/adrm-checks. Nothing can be uploaded: the job only
# has packages: read, and the init script fails the build if a remote publish task remains.
# Run it by hand to refresh the manifest (it opens a pull request when the module/file set changed);
# on pull requests that touch the build it fails when the manifest is stale.
name: Publication manifest
on:
  workflow_dispatch:
  pull_request:
    paths: ['**/*.gradle', 'gradle.properties', 'gradle/libs.versions.toml', '.github/workflows/publish.yml', '.readiness/publication.yaml']

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  manifest:
    # The bot's own manifest pull request was just produced by this workflow: do not rebuild to re-check it.
    if: github.event_name != 'pull_request' || github.head_ref != 'readiness/publication-manifest'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
    - name: Redirect the publisher to a sandbox
      id: sandbox
      uses: arenadata/adrm-checks/actions/sandbox@6be18fed3f222b843af0e9fcbf8bc7306047dedd
      with:
        tool: gradle
    - name: Write locks to workaround Ozone lib conflict
      run: ./gradlew checkClassUniqueness --write-locks -x test -x integrationTest -DsparkVersions=3.5 -DflinkVersions= -Pquick
    - name: Build with Gradle
      run: ./gradlew build -x test -x integrationTest -DsparkVersions=3.5 -DflinkVersions= -Pquick
    - name: Publish into the sandbox (the publish.yml commands, unchanged)
      run: |
        ./gradlew printVersion
        ./gradlew \
          -DallModules \
          -DknownFlinkVersions=1.19,1.20,2.0 \
          -PmavenUsername="${GITHUB_ACTOR}" \
          -PmavenPassword="${GITHUB_TOKEN}" \
          -PmavenUrl=https://maven.pkg.github.com/arenadata/iceberg \
          publishApachePublicationToArenadataRepository \
          --no-parallel \
          --no-configuration-cache
        ./gradlew \
          -DflinkVersions= \
          -DsparkVersions=3.4 \
          -DscalaVersion=2.13 \
          -DkafkaVersions= \
          -PmavenUsername="${GITHUB_ACTOR}" \
          -PmavenPassword="${GITHUB_TOKEN}" \
          -PmavenUrl=https://maven.pkg.github.com/arenadata/iceberg \
          :iceberg-spark:iceberg-spark-3.4_2.13:publishApachePublicationToArenadataRepository \
          :iceberg-spark:iceberg-spark-extensions-3.4_2.13:publishApachePublicationToArenadataRepository \
          :iceberg-spark:iceberg-spark-runtime-3.4_2.13:publishApachePublicationToArenadataRepository \
          --no-parallel \
          --no-configuration-cache
        ./gradlew \
          -DflinkVersions= \
          -DsparkVersions=3.5 \
          -DscalaVersion=2.13 \
          -DkafkaVersions= \
          -PmavenUsername="${GITHUB_ACTOR}" \
          -PmavenPassword="${GITHUB_TOKEN}" \
          -PmavenUrl=https://maven.pkg.github.com/arenadata/iceberg \
          :iceberg-spark:iceberg-spark-3.5_2.13:publishApachePublicationToArenadataRepository \
          :iceberg-spark:iceberg-spark-extensions-3.5_2.13:publishApachePublicationToArenadataRepository \
          :iceberg-spark:iceberg-spark-runtime-3.5_2.13:publishApachePublicationToArenadataRepository \
          --no-parallel \
          --no-configuration-cache

    # Flink 2.2 is built with Java 21
    - name: Set up JDK 21 for Flink 2.2
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Publish Flink 2.2 into the sandbox (the publish.yml command, unchanged)
      run: |
        ./gradlew \
          -DflinkVersions=2.2 \
          -DsparkVersions= \
          -DkafkaVersions= \
          -PmavenUsername="${GITHUB_ACTOR}" \
          -PmavenPassword="${GITHUB_TOKEN}" \
          -PmavenUrl=https://maven.pkg.github.com/arenadata/iceberg \
          :iceberg-flink:iceberg-flink-2.2:publishApachePublicationToArenadataRepository \
          :iceberg-flink:iceberg-flink-runtime-2.2:publishApachePublicationToArenadataRepository \
          --no-parallel \
          --no-configuration-cache
    - name: Generate the manifest from the sandbox
      id: manifest
      uses: arenadata/adrm-checks/actions/manifest@6be18fed3f222b843af0e9fcbf8bc7306047dedd
      with:
        sandbox: ${{ steps.sandbox.outputs.dir }}/arenadata   # the publishing repository name from deploy.gradle
        invocations: '4'
    - name: Open a pull request when the module/file set changed
      if: steps.manifest.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
      uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
      with:
        # Commit only the manifest: the publisher build may leave other files in the tree (locks, caches).
        add-paths: .readiness/publication.yaml
        branch: readiness/publication-manifest
        title: 'readiness: refresh publication manifest'
        commit-message: 'readiness: refresh publication manifest from the publisher sandbox'
        body: 'The module/file set produced by the publisher differs from .readiness/publication.yaml. Review the diff: added entries are new publications, removed entries are publications that disappeared.'
    - name: Fail the pull request check when the manifest is stale
      if: steps.manifest.outputs.changed == 'true' && github.event_name == 'pull_request'
      run: |
        git --no-pager diff -- .readiness/publication.yaml
        echo "::error::.readiness/publication.yaml is stale; run the Publication manifest workflow"; exit 1
